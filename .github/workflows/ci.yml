name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # The release PR exists to consume changesets, so this check can never
      # pass there.
      - name: Changeset Status
        if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
        run: npx changeset status --since origin/main

      - name: Lint
        run: npm run lint

      - name: Check Types
        run: npm run check-types

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  macos-smoke:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm run test
