pre-commit:
  parallel: true
  jobs:
    - name: ultracite
      # No md/mdx: neither oxlint nor oxfmt handles markdown, so a docs-only
      # commit matches the glob, finds nothing to lint, and exits non-zero.
      glob: "*.{js,jsx,ts,tsx,json,jsonc,css,scss}"
      run: npx ultracite fix {staged_files} && git add {staged_files}
