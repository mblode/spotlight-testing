# `ultracite fix` runs oxfmt then oxlint, and oxlint exits non-zero when it is
# handed no lintable files. A staged set of only JSON/CSS therefore failed the
# commit outright — as happens when the changesets bot commits "Version
# Packages" (JSON only), or when a commit touches only a dot-directory config
# like .vscode/ or .github/, which oxlint ignores anyway. So: lint only what
# oxlint can lint, and format the rest with oxfmt directly.
#
# The same reasoning already excludes md/mdx everywhere — neither tool handles
# markdown, so a docs-only commit would hit the identical empty-set failure.
pre-commit:
  parallel: true
  jobs:
    - name: ultracite
      glob: "*.{js,jsx,ts,tsx}"
      run: npx ultracite fix {staged_files}
      stage_fixed: true
    - name: oxfmt
      glob: "*.{json,jsonc,css}"
      # oxfmt ignores lockfiles, and exits non-zero when every file it is given
      # is ignored — so a lockfile-only commit would fail the hook.
      exclude:
        - "package-lock.json"
        - "**/package-lock.json"
      run: npx oxfmt --write {staged_files}
      stage_fixed: true
